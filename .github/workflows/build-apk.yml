name: Compilar PSeInt APK para Android
​on:
push:
branches: [ main, master ]
workflow_dispatch:
​jobs:
build:
name: Compilación de APK Android
runs-on: ubuntu-latest
​steps:
- name: Clonar repositorio
uses: actions/checkout@v4
​- name: Configurar Node.js 20
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Configurar Java 17
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: 17
​- name: Aceptar licencias de Android SDK
run: |
yes | sdkmanager --licenses || true
​- name: Inicializar proyecto nativo Capacitor
run: |
npm init -y
npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
mkdir -p www
cp index.html www/index.html
npx cap init "PSeInt" "com.aethell.pseint" --web-dir www
npx cap add android
npx cap sync android
​- name: Compilar archivo APK con Gradle
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug --stacktrace
​- name: Subir APK generado
uses: actions/upload-artifact@v4
with:
name: PSeInt-Android-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
retention-days: 14
