name: Build APK
on:
push:
branches:
- main
- master
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4
- name: Node
uses: actions/setup-node@v4
with:
node-version: 20
- name: Java
uses: actions/setup-java@v4
with:
distribution: zulu
java-version: 17
- name: Build
run: |
npm init -y
npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
mkdir -p www
cp index.html www/index.html
npx cap init PSeInt com.aethell.pseint --web-dir www
npx cap add android
cd android
chmod +x gradlew
./gradlew assembleDebug
- name: Upload
uses: actions/upload-artifact@v4
with:
name: PSeInt-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
